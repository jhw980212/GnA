# Site identity and deployment.
title: "Growth and Aging Lab"
description: "Exercise physiology research on growth, aging, cardiovascular function, and athletic performance at Kyung Hee University."
# GitHub Pages deployment settings
url: "https://galab.khu.ac.kr"
baseurl: ""

# Lab contact links.
links:
  email: "jhc@khu.ac.kr"
  orcid: "0000-0002-3465-8965"
  google-scholar: "https://scholar.google.com/citations?user=qm1Ao-oAAAAJ&hl=ko&oi=ao"

# File-based content collections and their layouts.

defaults:
  # 모든 markdown 기본 레이아웃
  - scope:
      path: ""
    values:
      layout: default

  # member profiles
  - scope:
      type: "members"
    values:
      layout: member

  # notice (공지)
  - scope:
      type: "notice"
    values:
      layout: post

  # blog (활동 기록)
  - scope:
      type: "blog"
    values:
      layout: post

collections:
  members:
    output: true
    permalink: /members/:path/

  notice:
    output: true
    permalink: /notice/:name/

  blog:
    output: true
    permalink: /blog/:name/

# Rendering.
markdown: kramdown
highlighter: rouge

# Search discovery and source modification dates.
plugins:
  - jekyll-sitemap
  - jekyll-last-modified-at

# Assets served by the site; development-only files stay out of the build.
include:
  - _styles
  - _scripts

exclude:
  - .preview
  - debug.log
  - README.md
  - content-templates
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
