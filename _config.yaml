# ============================================
# SITE INFORMATION
# ============================================
title: "Growth and Aging Lab"
subtitle: "Exercise Physiology"
description: "Exercise physiology research on growth, aging, cardiovascular function, and athletic performance at Kyung Hee University."
# GitHub Pages deployment settings
url: "https://galab.khu.ac.kr"
baseurl: ""

# ============================================
# SOCIAL / CONTACT
# ============================================
links:
  email: "jhc@khu.ac.kr"
  orcid: "0000-0002-3465-8965"
  google-scholar: "https://scholar.google.com/citations?user=qm1Ao-oAAAAJ&hl=ko&oi=ao"

# ============================================
# COLLECTIONS & DEFAULTS
# ============================================

defaults:
  # 모든 markdown 기본 레이아웃
  - scope:
      path: ""
    values:
      layout: default

  # member profiles
  - scope:
      type: "members"
    values:
      layout: member

  # blog posts (_posts)
  - scope:
      type: "posts"
    values:
      layout: post

  # notice (공지)
  - scope:
      type: "notice"
    values:
      layout: post

  # blog (활동 기록)
  - scope:
      type: "blog"
    values:
      layout: post

collections:
  members:
    output: true

  posts:
    output: true

  notice:
    output: true
    permalink: /notice/:name/

  blog:
    output: true
    permalink: /blog/:name/

# ============================================
# JEKYLL SETTINGS
# ============================================
markdown: kramdown
highlighter: rouge

# ⚠️ 이 permalink는 posts에만 적용됨
permalink: /:categories/:title/

# ============================================
# PLUGINS (GitHub Pages 허용 범위)
# ============================================
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# ============================================
# THEME SETTINGS
# ============================================
theme: null   # 로컬 커스텀 테마 사용

# ============================================
# STATIC ASSETS
# ============================================
include:
  - _styles
  - _scripts

exclude:
  - .preview
  - README.md
  - content-templates
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules

# Optional settings
# timezone: Asia/Seoul
# lang: en
