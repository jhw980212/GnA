<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark">
    <title>사이트 점검 중 | {{ site.title | escape }}</title>
    <meta name="description" content="{{ site.maintenance_message | escape }}">
    <meta property="og:title" content="사이트 점검 중 | {{ site.title | escape }}">
    <meta property="og:description" content="{{ site.maintenance_message | escape }}">
    <link rel="icon" type="image/jpeg" href="{{ '/images/web_icon.jpg' | relative_url }}">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; background: #101012; color: #f6f6f4; font-family: Arial, "Noto Sans KR", sans-serif; line-height: 1.7; }
      main { width: 100%; max-width: 480px; }
      .lab { margin: 0 0 40px; font-size: 15px; color: #b1b1b5; }
      .status { display: flex; align-items: center; gap: 9px; margin: 0 0 14px; font-size: 13px; color: #c3c3c9; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #e8bd78; }
      h1 { margin: 0 0 18px; font-size: clamp(26px, 5vw, 34px); font-weight: 500; line-height: 1.35; letter-spacing: -.03em; }
      .message { margin: 0; font-size: 16px; color: #b1b1b5; overflow-wrap: anywhere; }
      footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid #ffffff25; font-size: 13px; color: #919198; }
    </style>
  </head>
  <body>
    <main>
      <p class="lab">Growth &amp; Aging Lab</p>
      <p class="status">Temporarily unavailable</p>
      <h1>사이트 점검 중입니다.</h1>
      <p class="message">{{ site.maintenance_message | escape }}</p>
      <footer>Kyung Hee University · Growth &amp; Aging Lab</footer>
    </main>
  </body>
</html>
