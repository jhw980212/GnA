<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body class="site-shell content-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content"{% if page.reading_width %} class="reading-layout{% if page.section_sidebar %} section-layout{% endif %}"{% endif %}>
      {% if page.nav and page.custom_heading != true %}{% include page-heading.html %}{% endif %}
      <div class="page-content">{{ content }}</div>
    </main>
    {% include footer.html %}
  </body>
</html>
